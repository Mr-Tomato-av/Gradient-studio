<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Overlay Studio v4</title>
  <link rel="icon" type="image/png" href="logo.png">
  <!-- Discord & Social Media Embeds (Open Graph) -->
  <meta property="og:title" content="Gradient Overlay Studio" />
  <meta property="og:description" content="A simple, free tool to add gorgeous halftone, solid, and striped gradient frames and logos to your images." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mr-tomato-av.github.io/Gradient-studio/" />

  <!-- The preview image that shows up in the embed -->
  <meta property="og:image" content="logo.png" />

  <!-- This changes the color of the vertical bar on the left side of the Discord embed -->
  <meta name="theme-color" content="#3b82f6" />
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Sidebar Controls */
    .controls {
      width: 320px;
      background-color: var(--card-bg);
      padding: 24px;
      box-shadow: 4px 0 15px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
      overflow-y: auto;
    }
    h2 { margin-top: 0; font-size: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); display: flex; justify-content: space-between; }
    input[type="file"] { background: var(--border); padding: 8px; border-radius: 6px; color: var(--text); font-size: 0.8rem; cursor: pointer; border: 1px solid transparent; }
    input[type="file"]:hover { border-color: var(--accent); }
    input[type="color"] { border: none; width: 100%; height: 36px; border-radius: 6px; cursor: pointer; background: transparent; padding: 0; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    select { background: var(--border); color: var(--text); padding: 10px; border-radius: 6px; border: 1px solid transparent; font-size: 0.9rem; cursor: pointer; outline: none; }
    select:hover { border-color: var(--accent); }
    
    /* Side Manager Configs */
    .side-manager {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #33415540;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .side-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid #33415560;
      padding-bottom: 12px;
    }
    .side-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .side-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text);
      font-weight: bold;
    }
    .checkbox-label input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .range-inputs {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .range-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .range-row input[type="range"] {
      width: 55%;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    button:hover { background-color: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    button#resetBtn { background-color: var(--border); color: var(--text-muted); margin-top: 0; }
    button#resetBtn:hover { background-color: #475569; color: var(--text); }

    /* Custom Position UI */
    .position-controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 4px; }
    .pos-input-group { display: flex; align-items: center; background: #33415560; border-radius: 4px; padding: 4px 8px; border: 1px solid var(--border); }
    .pos-input-group span { color: var(--text-muted); font-weight: bold; margin-right: 6px; }
    .pos-input-group input { background: transparent; border: none; color: var(--text); width: 100%; font-size: 0.9rem; padding: 2px; text-align: right; }
    .pos-input-group input:focus { outline: none; color: var(--accent); }
    .pos-input-group small { color: var(--text-muted); margin-left: 2px; }

    /* Workspace Area */
    .workspace {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background-image: radial-gradient(#334155 1px, transparent 1px);
      background-size: 20px 20px;
      position: relative;
    }
    .canvas-container {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border-radius: 8px;
      overflow: hidden;
      background-color: #1e293b60;
    }
    canvas { display: block; max-width: 100%; max-height: 85vh; object-fit: contain; cursor: crosshair; }
  </style>
</head>
<body>

  <!-- Controls Panel -->
  <div class="controls">
    <h2>Editor Panel</h2>
    
    <div class="control-group">
      <label>1. Background Image</label>
      <input type="file" id="bgInput" accept="image/*">
    </div>

    <div class="control-group">
      <label>2. Gradient Style</label>
      <select id="stylePicker">
        <option value="dotted">Dotted Classic (Halftone)</option>
        <option value="solid">Solid Smooth Gradient</option>
        <option value="striped">Striped Linework</option>
      </select>
    </div>

    <div class="control-group">
      <label>3. Gradient Color</label>
      <input type="color" id="colorPicker" value="#004fc4">
    </div>

    <div class="control-group">
      <label>4. Active Sides &amp; Custom Alignment</label>
      <div class="side-manager">
        <!-- Left Side Row -->
        <div class="side-row">
          <div class="side-header">
            <label class="checkbox-label"><input type="checkbox" id="sideLeft" checked> Left Side</label>
          </div>
          <div class="range-inputs">
            <div class="range-row"><span>Size:</span><input type="range" id="thickLeft" min="5" max="100" value="35"><span id="thickLeftVal">35%</span></div>
            <div class="range-row"><span>Start Y:</span><input type="range" id="startLeft" min="0" max="100" value="0"><span id="startLeftVal">0%</span></div>
            <div class="range-row"><span>End Y:</span><input type="range" id="endLeft" min="0" max="100" value="100"><span id="endLeftVal">100%</span></div>
          </div>
        </div>
        
        <!-- Right Side Row -->
        <div class="side-row">
          <div class="side-header">
            <label class="checkbox-label"><input type="checkbox" id="sideRight"> Right Side</label>
          </div>
          <div class="range-inputs">
            <div class="range-row"><span>Size:</span><input type="range" id="thickRight" min="5" max="100" value="35"><span id="thickRightVal">35%</span></div>
            <div class="range-row"><span>Start Y:</span><input type="range" id="startRight" min="0" max="100" value="0"><span id="startRightVal">0%</span></div>
            <div class="range-row"><span>End Y:</span><input type="range" id="endRight" min="0" max="100" value="100"><span id="endRightVal">100%</span></div>
          </div>
        </div>

        <!-- Top Side Row -->
        <div class="side-row">
          <div class="side-header">
            <label class="checkbox-label"><input type="checkbox" id="sideTop"> Top Side</label>
          </div>
          <div class="range-inputs">
            <div class="range-row"><span>Size:</span><input type="range" id="thickTop" min="5" max="100" value="35"><span id="thickTopVal">35%</span></div>
            <div class="range-row"><span>Start X:</span><input type="range" id="startX" min="0" max="100" value="0"><span id="startXVal">0%</span></div>
            <div class="range-row"><span>End X:</span><input type="range" id="endX" min="0" max="100" value="100"><span id="endXVal">100%</span></div>
          </div>
        </div>

        <!-- Bottom Side Row -->
        <div class="side-row">
          <div class="side-header">
            <label class="checkbox-label"><input type="checkbox" id="sideBottom"> Bottom Side</label>
          </div>
          <div class="range-inputs">
            <div class="range-row"><span>Size:</span><input type="range" id="thickBottom" min="5" max="100" value="35"><span id="thickBottomVal">35%</span></div>
            <div class="range-row"><span>Start X:</span><input type="range" id="startXBot" min="0" max="100" value="0"><span id="startXBotVal">0%</span></div>
            <div class="range-row"><span>End X:</span><input type="range" id="endXBot" min="0" max="100" value="100"><span id="endXBotVal">100%</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="control-group" style="margin-top: 10px; border-top: 1px solid var(--border); padding-top: 16px;">
      <label>5. Upload Logo</label>
      <input type="file" id="logoInput" accept="image/*">
    </div>
    
    <div class="control-group">
      <label>6. Logo Size<span id="logoSizeVal">150px</span></label>
      <input type="range" id="logoSizeSlider" min="10" max="2000" value="150" step="10">
    </div>

    <div class="control-group">
      <label>7. Logo Position (X, Y)</label>
      <div class="position-controls">
        <div class="pos-input-group">
          <span>X</span>
          <input type="number" id="logoX" value="40">
          <small>px</small>
        </div>
        <div class="pos-input-group">
          <span>Y</span>
          <input type="number" id="logoY" value="40">
          <small>px</small>
        </div>
      </div>
      <small style="color: var(--text-muted); font-size: 0.75rem; margin-top: 4px;">Or **click/drag** the canvas to position</small>
    </div>

    <button id="resetBtn">Reset Logo Position</button>
    <button id="downloadBtn" style="margin-top: auto;">Download Image</button>
  </div>

  <!-- Real-time Preview Area -->
  <div class="workspace">
    <div class="canvas-container">
      <canvas id="editorCanvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');

    // Controls
    const bgInput = document.getElementById('bgInput');
    const stylePicker = document.getElementById('stylePicker');
    const colorPicker = document.getElementById('colorPicker');
    const logoInput = document.getElementById('logoInput');
    const logoSizeSlider = document.getElementById('logoSizeSlider');
    const logoSizeValDisplay = document.getElementById('logoSizeVal');
    const logoXInput = document.getElementById('logoX');
    const logoYInput = document.getElementById('logoY');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // Dynamic Multi-Range State Mapper per Border Block
    const sides = {
      left: {
        cb: document.getElementById('sideLeft'),
        thick: document.getElementById('thickLeft'), thickVal: document.getElementById('thickLeftVal'),
        start: document.getElementById('startLeft'), startVal: document.getElementById('startLeftVal'),
        end: document.getElementById('endLeft'), endVal: document.getElementById('endLeftVal')
      },
      right: {
        cb: document.getElementById('sideRight'),
        thick: document.getElementById('thickRight'), thickVal: document.getElementById('thickRightVal'),
        start: document.getElementById('startRight'), startVal: document.getElementById('startRightVal'),
        end: document.getElementById('endRight'), endVal: document.getElementById('endRightVal')
      },
      top: {
        cb: document.getElementById('sideTop'),
        thick: document.getElementById('thickTop'), thickVal: document.getElementById('thickTopVal'),
        start: document.getElementById('startX'), startVal: document.getElementById('startXVal'),
        end: document.getElementById('endX'), endVal: document.getElementById('endXVal')
      },
      bottom: {
        cb: document.getElementById('sideBottom'),
        thick: document.getElementById('thickBottom'), thickVal: document.getElementById('thickBottomVal'),
        start: document.getElementById('startXBot'), startVal: document.getElementById('startXBotVal'),
        end: document.getElementById('endXBot'), endVal: document.getElementById('endXBotVal')
      }
    };

    let bgImage = null;
    let logoImage = null;
    let isDragging = false;
    let dragStartX, dragStartY;
    const DEFAULT_LOGO_POS = 40;

    function initCanvas() {
      canvas.width = 1280;
      canvas.height = 720;
      draw();
    }

    function hexToRgbStr(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `${r}, ${g}, ${b}`;
    }

    function drawSideGradient(side, style, color, rgb, thickPct, startPct, endPct) {
      const gWidth = canvas.width * thickPct;
      const gHeight = canvas.height * thickPct;
      const dotSpacing = 16;
      const lineWidth = 8;

      let minX = 0, maxX = canvas.width, minY = 0, maxY = canvas.height;
      if (side === 'left' || side === 'right') {
        minY = canvas.height * startPct;
        maxY = canvas.height * endPct;
      } else {
        minX = canvas.width * startPct;
        maxX = canvas.width * endPct;
      }

      if (style === 'dotted') {
        let loopStartX = 0, loopEndX = canvas.width, loopStartY = 0, loopEndY = canvas.height;
        if (side === 'left') loopEndX = gWidth;
        if (side === 'right') loopStartX = canvas.width - gWidth;
        if (side === 'top') loopEndY = gHeight;
        if (side === 'bottom') loopStartY = canvas.height - gHeight;

        for (let x = loopStartX; x < loopEndX; x += dotSpacing) {
          for (let y = loopStartY; y < loopEndY; y += dotSpacing) {
            if (x >= minX && x <= maxX && y >= minY && y <= maxY) {
              let ratio = 0;
              if (side === 'left') ratio = 1 - (x / gWidth);
              if (side === 'right') ratio = 1 - ((canvas.width - x) / gWidth);
              if (side === 'top') ratio = 1 - (y / gHeight);
              if (side === 'bottom') ratio = 1 - ((canvas.height - y) / gHeight);

              if (ratio > 0) {
                const radius = (dotSpacing / 2) * Math.pow(ratio, 1.2) * 1.3;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x + dotSpacing/2, y + dotSpacing/2, Math.max(0, radius), 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        }
      } 
      
      else if (style === 'solid') {
        let grad;
        ctx.save();
        ctx.beginPath();
        if (side === 'left') ctx.rect(0, minY, gWidth, maxY - minY);
        if (side === 'right') ctx.rect(canvas.width - gWidth, minY, gWidth, maxY - minY);
        if (side === 'top') ctx.rect(minX, 0, maxX - minX, gHeight);
        if (side === 'bottom') ctx.rect(minX, canvas.height - gHeight, maxX - minX, gHeight);
        ctx.clip();

        if (side === 'left') {
          grad = ctx.createLinearGradient(0, 0, gWidth, 0);
          grad.addColorStop(0, `rgba(${rgb}, 1)`);
          grad.addColorStop(1, `rgba(${rgb}, 0)`);
          ctx.fillStyle = grad;
          ctx.fillRect(0, minY, gWidth, maxY - minY);
        }
        else if (side === 'right') {
          grad = ctx.createLinearGradient(canvas.width, 0, canvas.width - gWidth, 0);
          grad.addColorStop(0, `rgba(${rgb}, 1)`);
          grad.addColorStop(1, `rgba(${rgb}, 0)`);
          ctx.fillStyle = grad;
          ctx.fillRect(canvas.width - gWidth, minY, gWidth, maxY - minY);
        }
        else if (side === 'top') {
          grad = ctx.createLinearGradient(0, 0, 0, gHeight);
          grad.addColorStop(0, `rgba(${rgb}, 1)`);
          grad.addColorStop(1, `rgba(${rgb}, 0)`);
          ctx.fillStyle = grad;
          ctx.fillRect(minX, 0, maxX - minX, gHeight);
        }
        else if (side === 'bottom') {
          grad = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - gHeight);
          grad.addColorStop(0, `rgba(${rgb}, 1)`);
          grad.addColorStop(1, `rgba(${rgb}, 0)`);
          ctx.fillStyle = grad;
          ctx.fillRect(minX, canvas.height - gHeight, maxX - minX, gHeight);
        }
        ctx.restore();
      } 
      
      else if (style === 'striped') {
        if (side === 'left') {
          for (let x = 0; x < gWidth; x += lineWidth * 2) {
            const ratio = 1 - (x / gWidth);
            ctx.fillStyle = `rgba(${rgb}, ${ratio})`;
            ctx.fillRect(x, minY, lineWidth, maxY - minY);
          }
        }
        else if (side === 'right') {
          for (let x = canvas.width; x > canvas.width - gWidth; x -= lineWidth * 2) {
            const ratio = 1 - ((canvas.width - x) / gWidth);
            ctx.fillStyle = `rgba(${rgb}, ${ratio})`;
            ctx.fillRect(x - lineWidth, minY, lineWidth, maxY - minY);
          }
        }
        else if (side === 'top') {
          for (let y = 0; y < gHeight; y += lineWidth * 2) {
            const ratio = 1 - (y / gHeight);
            ctx.fillStyle = `rgba(${rgb}, ${ratio})`;
            ctx.fillRect(minX, y, maxX - minX, lineWidth);
          }
        }
        else if (side === 'bottom') {
          for (let y = canvas.height; y > canvas.height - gHeight; y -= lineWidth * 2) {
            const ratio = 1 - ((canvas.height - y) / gHeight);
            ctx.fillStyle = `rgba(${rgb}, ${ratio})`;
            ctx.fillRect(minX, y - lineWidth, maxX - minX, lineWidth);
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Background
      if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 28px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('Upload a background image to begin', canvas.width / 2, canvas.height / 2);
      }

      // 2. Map Over Borders Configs
      const color = colorPicker.value;
      const rgb = hexToRgbStr(color);
      const style = stylePicker.value;

      Object.keys(sides).forEach(sideKey => {
        const side = sides[sideKey];
        if (side.cb.checked) {
          const thickPct = parseInt(side.thick.value) / 100;
          const startPct = parseInt(side.start.value) / 100;
          const endPct = parseInt(side.end.value) / 100;
          drawSideGradient(sideKey, style, color, rgb, thickPct, startPct, endPct);
        }
      });

      // 3. Render Positioned Logo Asset
      if (logoImage) {
        const logoSize = parseInt(logoSizeSlider.value);
        const aspectRatio = logoImage.height / logoImage.width;
        const drawWidth = logoSize;
        const drawHeight = logoSize * aspectRatio;

        const xPos = parseInt(logoXInput.value); 
        const yPos = parseInt(logoYInput.value);

        if (isDragging) {
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            ctx.strokeRect(xPos, yPos, drawWidth, drawHeight);
        }
        ctx.drawImage(logoImage, xPos, yPos, drawWidth, drawHeight);
      }
    }

    function getMousePos(canvas, evt) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (evt.clientX - rect.left) * (canvas.width / rect.width),
            y: (evt.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    // Drag / Drop Handling Canvas Listeners
    canvas.addEventListener('mousedown', (e) => {
        if (!logoImage) return;
        isDragging = true;
        const mousePos = getMousePos(canvas, e);
        dragStartX = mousePos.x - parseInt(logoXInput.value);
        dragStartY = mousePos.y - parseInt(logoYInput.value);
        canvas.style.cursor = 'grabbing';
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDragging || !logoImage) return;
        const mousePos = getMousePos(canvas, e);
        logoXInput.value = Math.round(mousePos.x - dragStartX);
        logoYInput.value = Math.round(mousePos.y - dragStartY);
        draw();
    });

    window.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            canvas.style.cursor = 'crosshair';
            draw(); 
        }
    });

    canvas.addEventListener('click', (e) => {
        if(!logoImage || isDragging) return; 
        const mousePos = getMousePos(canvas, e);
        logoXInput.value = Math.round(mousePos.x);
        logoYInput.value = Math.round(mousePos.y);
        draw();
    });

    bgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          bgImage = new Image();
          bgImage.onload = () => {
            canvas.width = bgImage.naturalWidth;
            canvas.height = bgImage.naturalHeight;
            logoSizeSlider.max = Math.max(canvas.width, canvas.height);
            draw();
          };
          bgImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    logoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          logoImage = new Image();
          logoImage.onload = draw;
          logoImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    stylePicker.addEventListener('change', draw);
    colorPicker.addEventListener('input', draw);
    logoSizeSlider.addEventListener('input', (e) => {
      logoSizeValDisplay.textContent = `${e.target.value}px`;
      draw();
    });
    logoXInput.addEventListener('input', draw);
    logoYInput.addEventListener('input', draw);

    // Dynamic Binding Loop for All Side Parameter Changes
    Object.keys(sides).forEach(sideKey => {
      const side = sides[sideKey];
      side.cb.addEventListener('change', draw);
      
      side.thick.addEventListener('input', (e) => {
        side.thickVal.textContent = `${e.target.value}%`;
        draw();
      });
      side.start.addEventListener('input', (e) => {
        side.startVal.textContent = `${e.target.value}%`;
        draw();
      });
      side.end.addEventListener('input', (e) => {
        side.endVal.textContent = `${e.target.value}%`;
        draw();
      });
    });

    resetBtn.addEventListener('click', () => {
        logoXInput.value = DEFAULT_LOGO_POS;
        logoYInput.value = DEFAULT_LOGO_POS;
        draw();
    });

    downloadBtn.addEventListener('click', () => {
      if (!bgImage) {
        alert("Please upload a background image first!");
        return;
      }
      const link = document.createElement('a');
      link.download = 'gradient-overlay-studio.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    initCanvas();
  </script>
</body>
</html>
